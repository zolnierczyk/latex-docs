name: Build PDFs

# Monorepo orchestrator: detects which project changed and builds only that one.
# Each project is built by the reusable .github/workflows/_build-latex.yml and
# publishes its own release (tags: todos-v*, pamietnik-v*, cheatsheets-v*,
# recipebook-v*).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      todos: ${{ steps.filter.outputs.todos }}
      pamietnik: ${{ steps.filter.outputs.pamietnik }}
      cheatsheets: ${{ steps.filter.outputs.cheatsheets }}
      recipebook: ${{ steps.filter.outputs.recipebook }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changed projects
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            todos:
              - 'todos/**'
              - '.github/workflows/build-pdf.yml'
              - '.github/workflows/_build-latex.yml'
            pamietnik:
              - 'pamietnik/**'
              - '.github/workflows/build-pdf.yml'
              - '.github/workflows/_build-latex.yml'
            cheatsheets:
              - 'cheatsheets/**'
              - '.github/workflows/build-pdf.yml'
              - '.github/workflows/_build-latex.yml'
            recipebook:
              - 'recipebook/**'
              - '.github/workflows/build-pdf.yml'
              - '.github/workflows/_build-latex.yml'

  todos:
    needs: changes
    if: ${{ needs.changes.outputs.todos == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_build-latex.yml
    with:
      working-directory: todos
      root-file: main.tex
      release-name: Todo List PDF
      tag-prefix: todos
      pdf-paths: todos/main.pdf

  pamietnik:
    needs: changes
    if: ${{ needs.changes.outputs.pamietnik == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_build-latex.yml
    with:
      working-directory: pamietnik
      root-file: main.tex
      release-name: Dziennik PDF
      tag-prefix: pamietnik
      pdf-paths: pamietnik/main.pdf

  cheatsheets:
    needs: changes
    if: ${{ needs.changes.outputs.cheatsheets == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_build-latex.yml
    with:
      working-directory: cheatsheets
      root-file: |
        designPatterns/Patterns.tex
        simple/simple.tex
      # Generate the MetaPost design-pattern diagrams (metauml/*-1.pdf) before compiling.
      pre-compile: (cd designPatterns/metauml && sh makePdf.bash)
      # Patterns.tex uses relative \includegraphics paths, so compile from each file's dir.
      work-in-root-dir: true
      release-name: Cheatsheets PDF
      tag-prefix: cheatsheets
      pdf-paths: |
        cheatsheets/designPatterns/Patterns.pdf
        cheatsheets/simple/simple.pdf

  recipebook:
    needs: changes
    if: ${{ needs.changes.outputs.recipebook == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_build-latex.yml
    with:
      working-directory: recipebook
      root-file: main.tex
      latexmk-args: -xelatex -file-line-error -interaction=nonstopmode
      release-name: Recipe Book PDF
      tag-prefix: recipebook
      pdf-paths: recipebook/main.pdf
